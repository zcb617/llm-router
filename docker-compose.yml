services:
  llm-router:
    build: .
    container_name: llm-router
    ports:
      - "38888:38888"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
      - ./certs:/app/certs
      - ./log:/app/log
      - /home/zhangcb/.kimi-code:/home/zhangcb/.kimi-code
      - /home/zhangcb/.codex:/root/.codex
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - DB_PATH=./data/llm_calls.db
      - KIMI_CODE_HOME=/home/zhangcb/.kimi-code
