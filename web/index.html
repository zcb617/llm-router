<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LLM Router - 调用记录查询</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            border: 'hsl(var(--border))',
            background: 'hsl(var(--background))',
            foreground: 'hsl(var(--foreground))',
          }
        }
      }
    }
  </script>
  <style>
    :root {
      --background: 0 0% 100%;
      --foreground: 222.2 84% 4.9%;
      --border: 214.3 31.8% 91.4%;
    }
    .dark {
      --background: 222.2 84% 4.9%;
      --foreground: 210 40% 98%;
      --border: 217.2 32.6% 17.5%;
    }
    body { background: hsl(var(--background)); color: hsl(var(--foreground)); }
    .truncate-cell {
      max-width: 200px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .truncate-cell-long {
      max-width: 300px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .logs-table {
      border-collapse: separate;
      border-spacing: 0;
    }
    .logs-table th,
    .logs-table td {
      border-right: 1px solid #e4e4e7;
      border-bottom: 1px solid #e4e4e7;
    }
    .logs-table th:last-child,
    .logs-table td:last-child {
      border-right: none;
    }
    .dark .logs-table th,
    .dark .logs-table td {
      border-color: #3f3f46;
    }
    .logs-th {
      position: relative;
    }
    .resize-handle {
      position: absolute;
      top: 0;
      right: -4px;
      width: 8px;
      height: 100%;
      cursor: col-resize;
      z-index: 20;
      touch-action: none;
    }
    .resize-handle::before {
      content: '';
      position: absolute;
      top: 6px;
      bottom: 6px;
      left: 3px;
      width: 1px;
      background: transparent;
      transition: background-color .12s;
    }
    .logs-th:hover .resize-handle::before,
    .resize-handle:hover::before {
      background: #a1a1aa;
    }
    .dark .logs-th:hover .resize-handle::before,
    .dark .resize-handle:hover::before {
      background: #71717a;
    }
    body.col-resizing,
    body.col-resizing * {
      cursor: col-resize !important;
      user-select: none !important;
    }
    .sort-asc::after { content: ' ▲'; }
    .sort-desc::after { content: ' ▼'; }
    .modal-backdrop {
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
    }
    .json-body {
      font-family: 'Courier New', monospace;
      font-size: 13px;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 400px;
      overflow-y: auto;
    }
    .json-highlight { color: #f59e0b; }
    html, body { height: 100%; }
  </style>
</head>
<body class="p-6 flex flex-col h-full">
  <div class="max-w-[95vw] mx-auto flex flex-col flex-1 min-h-0">
    <!-- Header -->
    <div class="flex items-center justify-between mb-6">
      <h1 class="text-2xl font-bold">LLM Router - 调用记录查询</h1>
      <div class="flex gap-2">
        <button id="colSettingsBtn" class="px-3 py-2 text-sm rounded-lg border border-zinc-300 dark:border-zinc-700 hover:bg-zinc-100 dark:hover:bg-zinc-800 transition">
          ⚙ 列设置
        </button>
        <button id="themeBtn" class="px-3 py-2 text-sm rounded-lg border border-zinc-300 dark:border-zinc-700 hover:bg-zinc-100 dark:hover:bg-zinc-800 transition">
          🌙 暗色
        </button>
      </div>
    </div>

    <!-- Search -->
    <div class="flex flex-wrap gap-3 mb-4">
      <div class="flex-1 min-w-[200px]">
        <input id="searchOriginal" type="text" placeholder="原始模型名称..." class="w-full px-3 py-2 rounded-lg border border-zinc-300 dark:border-zinc-700 bg-white dark:bg-zinc-900 focus:ring-2 focus:ring-blue-500 outline-none">
      </div>
      <div class="flex-1 min-w-[200px]">
        <input id="searchOverridden" type="text" placeholder="映射模型名称..." class="w-full px-3 py-2 rounded-lg border border-zinc-300 dark:border-zinc-700 bg-white dark:bg-zinc-900 focus:ring-2 focus:ring-blue-500 outline-none">
      </div>
      <button id="searchBtn" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">搜索</button>
      <button id="resetBtn" class="px-4 py-2 border border-zinc-300 dark:border-zinc-700 rounded-lg hover:bg-zinc-100 dark:hover:bg-zinc-800 transition">重置</button>
    </div>

    <!-- Table -->
    <div id="tableWrapper" class="overflow-hidden rounded-lg border border-zinc-300 dark:border-zinc-700 flex-1 min-h-0">
      <div class="overflow-auto h-full">
        <table id="logsTable" class="logs-table text-sm" style="width: 1400px; min-width: 1400px; table-layout: fixed;">
          <colgroup id="logsColGroup"></colgroup>
          <thead class="bg-zinc-100 dark:bg-zinc-800 sticky top-0 z-10">
            <tr id="headerRow"></tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>

    <!-- Pagination -->
    <div class="flex items-center justify-between mt-4 flex-wrap gap-3">
      <div class="flex items-center gap-2">
        <span class="text-sm text-zinc-500">每页</span>
        <select id="pageSize" class="px-2 py-1 rounded border border-zinc-300 dark:border-zinc-700 bg-white dark:bg-zinc-900">
          <option value="10">10</option>
          <option value="20" selected>20</option>
          <option value="50">50</option>
          <option value="100">100</option>
        </select>
        <span class="text-sm text-zinc-500">条</span>
      </div>
      <div class="flex items-center gap-2">
        <span id="pageInfo" class="text-sm text-zinc-500">第 1 页，共 1 页（0 条）</span>
        <button id="prevBtn" class="px-3 py-1 rounded border border-zinc-300 dark:border-zinc-700 hover:bg-zinc-100 dark:hover:bg-zinc-800 transition disabled:opacity-40">上一页</button>
        <button id="nextBtn" class="px-3 py-1 rounded border border-zinc-300 dark:border-zinc-700 hover:bg-zinc-100 dark:hover:bg-zinc-800 transition disabled:opacity-40">下一页</button>
      </div>
      <div class="flex items-center gap-2">
        <span class="text-sm text-zinc-500">跳转到</span>
        <input id="jumpPage" type="number" min="1" class="w-16 px-2 py-1 rounded border border-zinc-300 dark:border-zinc-700 bg-white dark:bg-zinc-900 text-center">
        <button id="jumpBtn" class="px-3 py-1 rounded border border-zinc-300 dark:border-zinc-700 hover:bg-zinc-100 dark:hover:bg-zinc-800 transition">跳转</button>
      </div>
    </div>
  </div>

  <!-- Column Settings Modal -->
  <div id="colModal" class="hidden fixed inset-0 z-50 flex items-center justify-center modal-backdrop">
    <div class="bg-white dark:bg-zinc-900 rounded-xl border border-zinc-300 dark:border-zinc-700 p-6 w-96 max-h-[80vh] overflow-y-auto shadow-2xl">
      <h2 class="text-lg font-semibold mb-4">列设置</h2>
      <div id="colList" class="space-y-2"></div>
      <div class="flex justify-end gap-2 mt-4">
        <button id="colResetBtn" class="px-4 py-2 text-sm rounded-lg border border-zinc-300 dark:border-zinc-700 hover:bg-zinc-100 dark:hover:bg-zinc-800 transition">恢复默认</button>
        <button id="colSaveBtn" class="px-4 py-2 text-sm bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">保存</button>
      </div>
    </div>
  </div>

  <!-- Detail Modal -->
  <div id="detailModal" class="hidden fixed inset-0 z-50 flex items-center justify-center modal-backdrop">
    <div class="bg-white dark:bg-zinc-900 rounded-xl border border-zinc-300 dark:border-zinc-700 w-[90vw] max-w-4xl max-h-[85vh] overflow-y-auto shadow-2xl">
      <div class="flex items-center justify-between p-4 border-b border-zinc-300 dark:border-zinc-700">
        <h2 class="text-lg font-semibold">调用详情</h2>
        <button id="closeDetailBtn" class="text-zinc-500 hover:text-zinc-300 text-2xl">&times;</button>
      </div>
      <div class="p-4 space-y-4">
        <div class="grid grid-cols-2 gap-4 text-sm">
          <div><span class="text-zinc-500">调用ID:</span> <code id="dCallId" class="ml-1 font-mono"></code></div>
          <div><span class="text-zinc-500">时间:</span> <span id="dTimestamp" class="ml-1"></span></div>
          <div><span class="text-zinc-500">方法:</span> <span id="dMethod" class="ml-1"></span></div>
          <div><span class="text-zinc-500">状态:</span> <span id="dStatus" class="ml-1"></span></div>
          <div><span class="text-zinc-500">URL:</span> <span id="dUrl" class="ml-1 break-all"></span></div>
          <div><span class="text-zinc-500">原始模型:</span> <span id="dOriginalModel" class="ml-1"></span></div>
          <div><span class="text-zinc-500">映射模型:</span> <span id="dOverriddenModel" class="ml-1"></span></div>
          <div><span class="text-zinc-500">耗时:</span> <span id="dDuration" class="ml-1"></span></div>
          <div><span class="text-zinc-500">首字耗时:</span> <span id="dFirstToken" class="ml-1"></span></div>
          <div><span class="text-zinc-500">流式类型:</span> <span id="dStreamType" class="ml-1"></span></div>
          <div><span class="text-zinc-500">Token:</span> <span id="dTokens" class="ml-1"></span></div>
        </div>
        <div>
          <h3 class="font-semibold mb-1 text-sm">请求头</h3>
          <pre id="dReqHeaders" class="json-body bg-zinc-100 dark:bg-zinc-800 rounded p-3 text-xs"></pre>
        </div>
        <div>
          <h3 class="font-semibold mb-1 text-sm">请求体</h3>
          <pre id="dReqBody" class="json-body bg-zinc-100 dark:bg-zinc-800 rounded p-3 text-xs"></pre>
        </div>
        <div>
          <h3 class="font-semibold mb-1 text-sm">响应头</h3>
          <pre id="dResHeaders" class="json-body bg-zinc-100 dark:bg-zinc-800 rounded p-3 text-xs"></pre>
        </div>
        <div>
          <h3 class="font-semibold mb-1 text-sm">响应体</h3>
          <pre id="dResBody" class="json-body bg-zinc-100 dark:bg-zinc-800 rounded p-3 text-xs"></pre>
        </div>
      </div>
    </div>
  </div>

<script>
const COLUMNS = [
  { key: 'call_id', label: '调用ID', default: true, minWidth: '180px' },
  { key: 'timestamp', label: '时间', default: true, minWidth: '165px' },
  { key: 'method', label: '方法', default: true, minWidth: '60px', width: '60px' },
  { key: 'call_status', label: '状态', default: true, minWidth: '80px', width: '80px' },
  { key: 'url', label: 'URL', default: true, minWidth: '200px' },
  { key: 'original_model', label: '原始模型', default: true, minWidth: '140px' },
  { key: 'overridden_model', label: '映射模型', default: true, minWidth: '140px' },
  { key: 'duration_ms', label: '耗时(ms)', default: true, minWidth: '100px' },
  { key: 'first_token_ms', label: '首字耗时(ms)', default: true, minWidth: '120px' },
  { key: 'stream_type', label: '流式类型', default: true, minWidth: '100px' },
  { key: 'tokens_input', label: '输入Token', default: true, minWidth: '100px' },
  { key: 'tokens_output', label: '输出Token', default: true, minWidth: '110px' },
];

const STORAGE_KEY = 'llm_router_columns';
const PAGE_SIZE_STORAGE_KEY = 'llm_router_logs_page_size_index';
const ALLOWED_PAGE_SIZES = [10, 20, 50, 100];
const DEFAULT_MIN_COL_WIDTH = 80;
const DEFAULT_MAX_COL_WIDTH = 700;
const LOGS_TABLE_MIN_WIDTH = 1400;

let state = {
  page: 1,
  pageSize: 20,
  total: 0,
  sortKey: 'timestamp',
  sortDir: 'desc',
  searchOriginal: '',
  searchOverridden: '',
  columns: createDefaultColumns()
};
let resizeState = null;
let suppressSortClick = false;
let dataQueryInFlight = false;

function parsePixelValue(value) {
  if (typeof value === 'number' && Number.isFinite(value)) return value;
  if (typeof value === 'string') {
    const parsed = parseInt(value, 10);
    if (Number.isFinite(parsed)) return parsed;
  }
  return NaN;
}

function toPixel(value) {
  return `${Math.round(value)}px`;
}

function getColumnMinWidth(col) {
  const parsed = parsePixelValue(col.minWidth);
  if (Number.isFinite(parsed)) return Math.max(DEFAULT_MIN_COL_WIDTH, parsed);
  return DEFAULT_MIN_COL_WIDTH;
}

function getColumnMaxWidth(col) {
  const parsed = parsePixelValue(col.maxWidth);
  if (Number.isFinite(parsed)) return Math.max(getColumnMinWidth(col), parsed);
  return DEFAULT_MAX_COL_WIDTH;
}

function normalizeColumn(raw, fallback = null) {
  const base = fallback ? { ...fallback, ...raw } : { ...raw };
  const minWidth = getColumnMinWidth(base);
  const widthValue = parsePixelValue(base.width);
  const width = Number.isFinite(widthValue) ? Math.max(minWidth, widthValue) : minWidth;
  return {
    ...base,
    visible: base.visible !== false,
    minWidth: toPixel(minWidth),
    width: toPixel(width),
  };
}

function createDefaultColumns() {
  return COLUMNS.map(col => normalizeColumn({ ...col, visible: true }));
}

function hydrateColumns(rawColumns) {
  if (!Array.isArray(rawColumns)) return createDefaultColumns();
  const templateByKey = new Map(COLUMNS.map(col => [col.key, col]));
  const result = [];
  rawColumns.forEach(col => {
    if (!col || !templateByKey.has(col.key)) return;
    result.push(normalizeColumn(col, templateByKey.get(col.key)));
  });
  COLUMNS.forEach(col => {
    if (!result.some(c => c.key === col.key)) result.push(normalizeColumn({ ...col, visible: true }));
  });
  return result;
}

function loadColumns() {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) {
    try {
      const parsed = JSON.parse(saved);
      state.columns = hydrateColumns(parsed);
      return;
    } catch(e) {}
  }
  state.columns = createDefaultColumns();
}

function saveColumns() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state.columns));
}

function normalizePageSize(value, fallback = 20) {
  const parsed = parseInt(value, 10);
  if (!Number.isFinite(parsed)) return fallback;
  if (!ALLOWED_PAGE_SIZES.includes(parsed)) return fallback;
  return parsed;
}

function loadPageSize() {
  const saved = localStorage.getItem(PAGE_SIZE_STORAGE_KEY);
  state.pageSize = normalizePageSize(saved, state.pageSize);
  const pageSizeSelect = document.getElementById('pageSize');
  if (pageSizeSelect) pageSizeSelect.value = String(state.pageSize);
}

function savePageSize() {
  localStorage.setItem(PAGE_SIZE_STORAGE_KEY, String(state.pageSize));
}

function getVisibleColumns() {
  return state.columns.filter(c => c.visible);
}

function renderColGroup() {
  const colGroup = document.getElementById('logsColGroup');
  const table = document.getElementById('logsTable');
  if (!colGroup) return;
  const visible = getVisibleColumns();
  colGroup.innerHTML = '';
  let totalWidth = 0;
  visible.forEach(col => {
    const width = parsePixelValue(col.width) || getColumnMinWidth(col);
    const colEl = document.createElement('col');
    colEl.dataset.colKey = col.key;
    colEl.style.width = toPixel(width);
    colEl.style.minWidth = toPixel(width);
    colGroup.appendChild(colEl);
    totalWidth += width;
  });
  if (table) {
    table.style.width = toPixel(Math.max(LOGS_TABLE_MIN_WIDTH, totalWidth));
    table.style.minWidth = toPixel(LOGS_TABLE_MIN_WIDTH);
  }
}

function syncColumnWidthInCells(colKey, widthPx) {
  const width = toPixel(widthPx);
  const cells = document.querySelectorAll(`#headerRow th[data-col-key="${colKey}"], #tableBody td[data-col-key="${colKey}"], #logsColGroup col[data-col-key="${colKey}"]`);
  cells.forEach(cell => {
    cell.style.width = width;
    cell.style.minWidth = width;
  });
}

function updateColumnWidth(colKey, widthPx, persist = true) {
  const col = state.columns.find(item => item.key === colKey);
  if (!col) return;
  const nextWidth = Math.min(getColumnMaxWidth(col), Math.max(getColumnMinWidth(col), widthPx));
  col.width = toPixel(nextWidth);
  syncColumnWidthInCells(col.key, nextWidth);
  if (persist) saveColumns();
}

function startColumnResize(event, colKey, th) {
  if (event.pointerType === 'mouse' && event.button !== 0) return;
  event.preventDefault();
  event.stopPropagation();
  suppressSortClick = true;
  const col = state.columns.find(item => item.key === colKey);
  if (!col) return;
  const startWidth = parsePixelValue(col.width) || th.offsetWidth || getColumnMinWidth(col);
  resizeState = {
    colKey,
    startX: event.clientX,
    startWidth,
  };
  document.body.classList.add('col-resizing');
  window.addEventListener('pointermove', onColumnResizeMove);
  window.addEventListener('pointerup', stopColumnResize);
  window.addEventListener('pointercancel', stopColumnResize);
}

function onColumnResizeMove(event) {
  if (!resizeState) return;
  event.preventDefault();
  const delta = event.clientX - resizeState.startX;
  updateColumnWidth(resizeState.colKey, resizeState.startWidth + delta, false);
}

function stopColumnResize() {
  if (!resizeState) return;
  saveColumns();
  resizeState = null;
  document.body.classList.remove('col-resizing');
  window.removeEventListener('pointermove', onColumnResizeMove);
  window.removeEventListener('pointerup', stopColumnResize);
  window.removeEventListener('pointercancel', stopColumnResize);
  setTimeout(() => { suppressSortClick = false; }, 0);
}

function attachResizeHandle(th, col) {
  const handle = document.createElement('div');
  handle.className = 'resize-handle';
  handle.title = `拖动调整${col.label}列宽`;
  handle.addEventListener('pointerdown', event => startColumnResize(event, col.key, th));
  handle.addEventListener('click', event => {
    event.preventDefault();
    event.stopPropagation();
  });
  th.appendChild(handle);
}

function renderHeader() {
  const tr = document.getElementById('headerRow');
  const visible = getVisibleColumns();
  tr.innerHTML = '';
  renderColGroup();
  visible.forEach(col => {
    const th = document.createElement('th');
    th.className = 'logs-th px-4 py-2 text-left font-medium whitespace-nowrap cursor-pointer select-none';
    th.dataset.colKey = col.key;
    th.style.width = col.width;
    th.style.minWidth = col.width;
    if (state.sortKey === col.key) {
      th.classList.add(state.sortDir === 'asc' ? 'sort-asc' : 'sort-desc');
    }
    const label = document.createElement('span');
    label.textContent = col.label;
    th.appendChild(label);
    th.addEventListener('click', (event) => {
      if (event.target.closest('.resize-handle')) return;
      if (suppressSortClick) return;
      if (state.sortKey === col.key) {
        state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
      } else {
        state.sortKey = col.key;
        state.sortDir = 'asc';
      }
      loadData();
    });
    attachResizeHandle(th, col);
    tr.appendChild(th);
  });
}

function renderTable(data) {
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = '';
  const visible = getVisibleColumns();
  data.forEach(row => {
    const tr = document.createElement('tr');
    tr.className = 'border-t border-zinc-200 dark:border-zinc-800 hover:bg-zinc-50 dark:hover:bg-zinc-800/50 transition';
    visible.forEach(col => {
      const td = document.createElement('td');
      td.className = 'px-4 py-2 whitespace-nowrap';
      td.dataset.colKey = col.key;
      td.style.width = col.width;
      td.style.minWidth = col.width;
      let val = row[col.key] ?? '';
      // 时间格式化：ISO 8601 -> yyyy-MM-dd HH:mm:ss
      if (col.key === 'timestamp' && val) {
        try {
          const d = new Date(val);
          val = d.getFullYear() + '-' +
            String(d.getMonth()+1).padStart(2,'0') + '-' +
            String(d.getDate()).padStart(2,'0') + ' ' +
            String(d.getHours()).padStart(2,'0') + ':' +
            String(d.getMinutes()).padStart(2,'0') + ':' +
            String(d.getSeconds()).padStart(2,'0');
        } catch(e) {}
      }
      // call_id 列：旧数据没有时显示 #id
      if (col.key === 'call_id' && !val) {
        val = row.id != null ? '#' + row.id : '';
      }
      // 调用ID列：可点击，鼠标指针手型
      if (col.key === 'call_id') {
        td.classList.add('truncate-cell', 'text-blue-500', 'cursor-pointer', 'hover:underline');
        td.title = val; // tooltip
        td.addEventListener('click', (e) => {
          e.stopPropagation();
          showDetail(row);
        });
      } else if (col.key === 'url') {
        td.classList.add('truncate-cell-long');
        td.title = val; // tooltip
      } else if (col.key === 'original_model' || col.key === 'overridden_model') {
        td.classList.add('truncate-cell');
        td.title = val; // tooltip
      }
      if (col.key === 'stream_type') {
        val = val === 'stream' ? '流式' : '非流式';
      }
      if (col.key === 'call_status') {
        if (val === 'failed') {
          val = '失败';
          td.classList.add('text-red-600', 'dark:text-red-400', 'font-semibold');
        } else if (val === 'success') {
          val = '成功';
          td.classList.add('text-emerald-600', 'dark:text-emerald-400');
        } else {
          val = '-';
        }
      }
      td.textContent = val;
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
}

function renderPagination() {
  const totalPages = Math.max(1, Math.ceil(state.total / state.pageSize));
  document.getElementById('pageInfo').textContent = `第 ${state.page} 页，共 ${totalPages} 页（${state.total} 条）`;
  document.getElementById('prevBtn').disabled = state.page <= 1;
  document.getElementById('nextBtn').disabled = state.page >= totalPages;
}

async function loadData() {
  if (dataQueryInFlight) return;
  dataQueryInFlight = true;
  const params = new URLSearchParams({
    limit: state.pageSize,
    offset: (state.page - 1) * state.pageSize,
    sort: state.sortKey,
    dir: state.sortDir,
    search_original: state.searchOriginal,
    search_overridden: state.searchOverridden
  });
  try {
    const res = await fetch('/api/calls?' + params.toString());
    const data = await res.json();
    let calls = data.calls || [];
    // 前端排序
    if (state.sortKey) {
      calls.sort((a, b) => {
        let va = a[state.sortKey] ?? '';
        let vb = b[state.sortKey] ?? '';
        if (typeof va === 'number') {
          return state.sortDir === 'asc' ? va - vb : vb - va;
        }
        return state.sortDir === 'asc' ? String(va).localeCompare(String(vb)) : String(vb).localeCompare(String(va));
      });
    }
    state.total = data.total || 0;
    renderHeader();
    renderTable(calls);
    renderPagination();
  } catch(e) {
    console.error(e);
    document.getElementById('tableBody').innerHTML = '<tr><td colspan="99" class="px-4 py-8 text-center text-zinc-500">加载失败: ' + e.message + '</td></tr>';
  } finally {
    dataQueryInFlight = false;
  }
}

function showDetail(row) {
  document.getElementById('dCallId').textContent = row.call_id || 'N/A';
  document.getElementById('dTimestamp').textContent = row.timestamp || '';
  document.getElementById('dMethod').textContent = row.method || '';
  document.getElementById('dStatus').textContent = row.call_status === 'failed' ? '失败' : (row.call_status === 'success' ? '成功' : '-');
  document.getElementById('dUrl').textContent = row.url || '';
  document.getElementById('dOriginalModel').textContent = row.original_model || '-';
  document.getElementById('dOverriddenModel').textContent = row.overridden_model || '-';
  document.getElementById('dDuration').textContent = (row.duration_ms ?? '-') + ' ms';
  document.getElementById('dFirstToken').textContent = row.first_token_ms ? row.first_token_ms + ' ms' : '-';
  document.getElementById('dStreamType').textContent = row.stream_type === 'stream' ? '流式' : '非流式';
  document.getElementById('dTokens').textContent = `输入: ${row.tokens_input ?? 0}, 输出: ${row.tokens_output ?? 0}`;

  try {
    document.getElementById('dReqHeaders').textContent = JSON.stringify(JSON.parse(row.request_headers || '{}'), null, 2);
  } catch { document.getElementById('dReqHeaders').textContent = row.request_headers || ''; }
  try {
    document.getElementById('dReqBody').textContent = JSON.stringify(JSON.parse(row.request_body || '{}'), null, 2);
  } catch { document.getElementById('dReqBody').textContent = row.request_body || ''; }
  try {
    document.getElementById('dResHeaders').textContent = JSON.stringify(JSON.parse(row.response_headers || '{}'), null, 2);
  } catch { document.getElementById('dResHeaders').textContent = row.response_headers || ''; }
  try {
    document.getElementById('dResBody').textContent = JSON.stringify(JSON.parse(row.response_body || '{}'), null, 2);
  } catch { document.getElementById('dResBody').textContent = row.response_body || ''; }

  document.getElementById('detailModal').classList.remove('hidden');
}

function showColumnSettings() {
  const list = document.getElementById('colList');
  list.innerHTML = '';
  state.columns.forEach((col, idx) => {
    const div = document.createElement('div');
    div.className = 'flex items-center gap-2 p-2 rounded hover:bg-zinc-100 dark:hover:bg-zinc-800';
    div.innerHTML = `
      <input type="checkbox" ${col.visible ? 'checked' : ''} data-idx="${idx}" class="col-cb">
      <span class="flex-1 text-sm">${col.label}</span>
      <button class="col-up px-2 text-xs disabled:opacity-30" data-idx="${idx}" ${idx === 0 ? 'disabled' : ''}>↑</button>
      <button class="col-down px-2 text-xs" data-idx="${idx}" ${idx === state.columns.length - 1 ? 'disabled' : ''}>↓</button>
    `;
    list.appendChild(div);
  });
  list.querySelectorAll('.col-up').forEach(btn => {
    btn.addEventListener('click', () => {
      const i = parseInt(btn.dataset.idx);
      if (i > 0) {
        [state.columns[i], state.columns[i-1]] = [state.columns[i-1], state.columns[i]];
        showColumnSettings();
      }
    });
  });
  list.querySelectorAll('.col-down').forEach(btn => {
    btn.addEventListener('click', () => {
      const i = parseInt(btn.dataset.idx);
      if (i < state.columns.length - 1) {
        [state.columns[i], state.columns[i+1]] = [state.columns[i+1], state.columns[i]];
        showColumnSettings();
      }
    });
  });
  document.getElementById('colModal').classList.remove('hidden');
}

// Theme
document.getElementById('themeBtn').addEventListener('click', () => {
  document.documentElement.classList.toggle('dark');
  document.getElementById('themeBtn').textContent = document.documentElement.classList.contains('dark') ? '🌙 暗色' : '☀ 亮色';
});

// Column settings
document.getElementById('colSettingsBtn').addEventListener('click', showColumnSettings);
document.getElementById('colModal').addEventListener('click', (e) => {
  if (e.target === document.getElementById('colModal')) document.getElementById('colModal').classList.add('hidden');
});
document.getElementById('colResetBtn').addEventListener('click', () => {
  state.columns = createDefaultColumns();
  saveColumns();
  document.getElementById('colModal').classList.add('hidden');
  renderHeader();
  loadData();
});
document.getElementById('colSaveBtn').addEventListener('click', () => {
  document.querySelectorAll('.col-cb').forEach(cb => {
    const idx = parseInt(cb.dataset.idx);
    state.columns[idx].visible = cb.checked;
  });
  saveColumns();
  document.getElementById('colModal').classList.add('hidden');
  renderHeader();
  loadData();
});

// Detail modal
document.getElementById('closeDetailBtn').addEventListener('click', () => {
  document.getElementById('detailModal').classList.add('hidden');
});
document.getElementById('detailModal').addEventListener('click', (e) => {
  if (e.target === document.getElementById('detailModal')) document.getElementById('detailModal').classList.add('hidden');
});

// Search
document.getElementById('searchBtn').addEventListener('click', () => {
  state.searchOriginal = document.getElementById('searchOriginal').value.trim();
  state.searchOverridden = document.getElementById('searchOverridden').value.trim();
  state.page = 1;
  loadData();
});
document.getElementById('resetBtn').addEventListener('click', () => {
  document.getElementById('searchOriginal').value = '';
  document.getElementById('searchOverridden').value = '';
  state.searchOriginal = '';
  state.searchOverridden = '';
  state.page = 1;
  loadData();
});

// Pagination
document.getElementById('pageSize').addEventListener('change', (e) => {
  state.pageSize = normalizePageSize(e.target.value, state.pageSize);
  e.target.value = String(state.pageSize);
  savePageSize();
  state.page = 1;
  loadData();
});
document.getElementById('prevBtn').addEventListener('click', () => {
  if (state.page > 1) { state.page--; loadData(); }
});
document.getElementById('nextBtn').addEventListener('click', () => {
  const totalPages = Math.ceil(state.total / state.pageSize);
  if (state.page < totalPages) { state.page++; loadData(); }
});
document.getElementById('jumpBtn').addEventListener('click', () => {
  const page = parseInt(document.getElementById('jumpPage').value);
  const totalPages = Math.ceil(state.total / state.pageSize);
  if (page >= 1 && page <= totalPages) { state.page = page; loadData(); }
});
document.getElementById('jumpPage').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('jumpBtn').click();
});

// Init
function calcTableHeight() {
  const wrapper = document.getElementById('tableWrapper');
  const header = wrapper.previousElementSibling; // search bar
  const headerTop = wrapper.parentElement.children[0]; // header div
  const pagination = wrapper.nextElementSibling;
  const rect = wrapper.getBoundingClientRect();
  const available = window.innerHeight - rect.top - 60; // 60px for pagination
  wrapper.style.height = Math.max(300, available) + 'px';
}
window.addEventListener('resize', calcTableHeight);
calcTableHeight();
loadColumns();
loadPageSize();
loadData();
</script>
</body>
