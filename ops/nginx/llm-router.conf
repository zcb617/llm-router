server {
    listen 443 ssl ;
    server_name llm-router.0573zzz.dpdns.org;

    # SSL 证书配置
    ssl_certificate /etc/ssl/0573zzz.dpdns.org/_.0573zzz.dpdns.org.crt;
    ssl_certificate_key /etc/ssl/0573zzz.dpdns.org/_.0573zzz.dpdns.org.key;
    ssl_session_timeout 5m;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE:ECDH:AES:HIGH:!NULL:!aNULL:!MD5:!ADH:!RC4;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # 日志配置
    access_log /var/log/nginx/llm-router-access.log llm_router_diag;
    error_log /var/log/nginx/llm-router-error.log info;

    # 代理配置
    location / {
        proxy_pass http://127.0.0.1:38888;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
	#让 nginx 用 HTTP/1.1 转发到 llm-router。默认可能按 HTTP/1.0 代理，不利于长连接、流式响应和部分 chunked 场景。
	proxy_http_version 1.1;
	#清掉 nginx 默认可能带给上游的 Connection: close，避免强制短连接。配合 HTTP/1.1 使用。
        proxy_set_header Connection "";
        #nginx 连接 127.0.0.1:38888 的超时时间。这个只管“连不连得上 llm-router”，不是模型调用等待时间。本机服务 5 秒足够，连不上应快速失败。
        proxy_connect_timeout 5s;
	#nginx 向 llm-router 发送请求体时，两次写操作之间的超时。大 prompt、大上下文上传时有用。
        proxy_send_timeout 1200s;
        send_timeout 300s;
	#最关键。nginx 等待 llm-router 返回响应头或响应数据的超时。你日志里的错误就是：
        proxy_read_timeout 1200s;
        #关闭响应缓冲。LLM 流式输出时，nginx 会尽快把上游数据转给客户端，降低首 token 延迟，也避免流式内容被 nginx 缓住。
        proxy_buffering off;
	#关闭请求体预缓冲。否则大请求体会先落到 /var/cache/nginx/client_temp/...，也就是你看到的 warn。关掉后 nginx 会边收客户端请求边转发给 llm-router。
        proxy_request_buffering off;
	#客户端请求体在内存里缓存的阈值。超过这个值才落临时文件。调大可以减少 client request body is buffered to a temporary file 这种 warn，但会增加并发大请求时的内存占用。
        client_body_buffer_size 32m;
	#允许的最大请求体大小。大上下文、图片、工具调用数据多时避免 nginx 返回 413 Request Entity Too Large。具体值按你的实际使用量定，不需要无限大。
        client_max_body_size 512m;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
    }


}

# HTTP 重定向到 HTTPS
server {
    listen 80;
    server_name llm-router.0573zzz.dpdns.org;
    return 301 https://$server_name$request_uri;
}
