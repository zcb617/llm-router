  # 模型配置请在控制台「模型配置」菜单中管理，不再在此文件中配置
  # auto_retry_max_attempts: 1             # 自动重试次数（仅针对 api_error server internal）
  # api_key_cache_ttl_seconds: 60            # API Key 正向缓存（秒）
  # api_key_negative_cache_ttl_seconds: 10   # API Key 负向缓存（秒）
  # call_save_queue_size: 5000               # 调用记录异步落库队列长度
  # call_save_workers: 2                     # 调用记录异步落库 worker 数量
  # stream_route_preconnect_timeout_ms: 800  # 多上游流式预探活超时（毫秒）
  # codex_app_server_token:                  # codex_app_server_token (已废弃，改为在上游管理中配置)

database:
